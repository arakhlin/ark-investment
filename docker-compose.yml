services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER to the trusted token issuer}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE to the API audience}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?Set JWT_JWK_SET_URI to the trusted JWKS endpoint}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ark_client}
      DB_USERNAME: ${POSTGRES_USER:-ark}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ark_local_only}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 30s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ark_client}
      POSTGRES_USER: ${POSTGRES_USER:-ark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ark_local_only}
    volumes:
      - postgres_client_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres_client_data:
