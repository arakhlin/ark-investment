name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests and OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No package lockfile: cache npx downloads without setup-node's lockfile-based cache.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-node22-redocly-2.75.0-v1

      - name: Check Docker and Ruby prerequisites
        run: |
          docker info
          ruby --version

      - name: Verify Java and PostgreSQL Testcontainers tests
        run: ./mvnw -B clean verify

      - name: Run monetary contract tests
        run: node --test docs/api/monetary-validation.test.cjs

      - name: Check local OIDC fixtures and startup orchestration
        run: node --test docs/demo/fixtures.test.cjs docs/demo/start.test.cjs

      - name: Validate OpenAPI with Redocly
        run: npx --yes @redocly/cli@2.75.0 lint docs/api/openapi.yaml
