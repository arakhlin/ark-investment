            schema:
              "$ref": "#/components/schemas/UserChange"
components:
  parameters:
    fundId:
      name: fundId
      in: path
      required: true
      description: Resource UUID.
      schema:
        type: string
        format: uuid
    investorId:
      name: investorId
      in: path
      required: true
      description: Resource UUID.
      schema:
        type: string
        format: uuid
    transactionId:
      name: transactionId
      in: path
      required: true
      description: Resource UUID.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Maximum items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    from:
      name: from
      in: query
      description: Inclusive transaction-date lower bound. Omitted means all history.
        Must be <= to when both are supplied.
      schema:
        type: string
        format: date
        example: '2026-11-06'
    to:
      name: to
      in: query
      description: Inclusive transaction-date upper bound. Omitted means no upper
        bound.
      schema:
        type: string
        format: date
        example: '2026-11-06'
    fundIdFilter:
      name: fundId
      in: query
      description: Filter by existing fundId. Unknown resource returns 404.
      schema:
        type: string
        format: uuid
    investorIdFilter:
      name: investorId
      in: query
      description: Filter by existing investorId. Unknown resource returns 404.
      schema:
        type: string
        format: uuid
    Type:
      name: type
      in: query
      description: Filter by transaction type.
      schema:
        "$ref": "#/components/schemas/TransactionType"
    clientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Explicit client selection; authorized using the authenticated identity
        and database-backed user type, role and Client ownership.
  responses:
    BadRequest:
      description: Malformed JSON, invalid UUID/date/enum, unknown fields, invalid
        pagination, nonpositive amount, or from > to.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            type: about:blank
            title: BadRequest
            status: 400
            detail: Malformed JSON, invalid UUID/date/enum, unknown fields, invalid
              pagination, nonpositive amount, or from > to.
    NotFound:
      description: Requested resource or referenced fund/investor does not exist.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            type: about:blank
            title: NotFound
            status: 404
            detail: Requested resource or referenced fund/investor does not exist.
    Conflict:
      description: Participation required, ownership change attempted, or deletion
        blocked by existing participation/transactions.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: Participation required, ownership change attempted, or deletion
              blocked by existing participation/transactions.
    UnsupportedMediaType:
      description: Request body must use application/json.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            type: about:blank
            title: UnsupportedMediaType
            status: 415
            detail: Request body must use application/json.
    InternalError:
      description: Unexpected server failure; internal implementation details are
        not exposed.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Error"
          example:
            type: about:blank
            title: InternalError
            status: 500
            detail: Unexpected server failure; internal implementation details are
              not exposed.
    Unauthorized:
      description: Missing or invalid JWT, unknown or disabled application identity.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: Active client member lacks permission.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Id:
      type: string
      format: uuid
    Amount:
      type: string
      pattern: "^(?!0\\.00$)(0|[1-9][0-9]{0,15})\\.[0-9]{2}(?![\\s\\S])"
      maxLength: 19
      description: 'Exact positive decimal with two fractional digits and at most
        16 integer digits (DECIMAL(18,2) compatible): 0.01 through 9999999999999999.99
        inclusive. Only ASCII digits and a literal decimal point are accepted; no
        sign, leading zeros (except the single integer zero), whitespace, exponent
        notation, or rounding. Zero is rejected. The final negative lookahead enforces
        the absolute end of the string, including rejection of trailing line terminators.
        Parse directly as BigDecimal; never convert through binary floating point.'
      example: '1250.00'
    Balance:
      type: string
      pattern: "^(?!-0\\.00$)-?(0|[1-9][0-9]*)\\.[0-9]{2}(?![\\s\\S])"
      description: Exact signed aggregate decimal; parse as BigDecimal. Aggregates
        are not restricted to the per-transaction precision. Exactly two fractional
        ASCII digits and a literal decimal point are required, with no whitespace,
        exponent notation, plus sign, or leading zeros except a single integer zero.
        Negative values are allowed; zero is serialized only as 0.00, never -0.00.
      example: '1200.00'
    Currency:
      type: string
      enum:
      - USD
      description: Single accounting currency; no currency conversion.
    FundInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
          example: Growth Fund
        description:
          type: string
          maxLength: 1000
    InvestorInput:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
          example: Alex Investor
        email:
          type: string
          format: email
          maxLength: 254
          example: alex@example.com
    TransactionType:
      type: string
      enum:
      - CONTRIBUTION
      - INTEREST_INCOME
      - DISTRIBUTION
      - GENERAL_EXPENSE
      - MANAGEMENT_FEE
      description: CONTRIBUTION and INTEREST_INCOME are credits (+). DISTRIBUTION,
        GENERAL_EXPENSE and MANAGEMENT_FEE are debits (-). This sign applies identically
        to fund and investor ledger reports.
    TransactionInput:
      type: object
      additionalProperties: false
      required:
      - fundId
      - investorId
      - date
      - amount
      - type
      properties:
        fundId:
          "$ref": "#/components/schemas/Id"
        investorId:
          "$ref": "#/components/schemas/Id"
        date:
          type: string
          format: date
          example: '2026-11-06'
        amount:
          "$ref": "#/components/schemas/Amount"
        type:
          "$ref": "#/components/schemas/TransactionType"
        description:
          type: string
          maxLength: 1000
    Error:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Invalid request
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
          example: amount must be greater than 0.00
        instance:
          type: string
          example: "/api/v1/clients/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/transactions"
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    ReportTotals:
      type: object
      additionalProperties: false
      required:
      - openingBalance
      - totalCredits
      - totalDebits
      - netMovement
      - closingBalance
      - transactionCount
      - byType
      properties:
        openingBalance:
          "$ref": "#/components/schemas/Balance"
        totalCredits:
          "$ref": "#/components/schemas/AmountTotal"
        totalDebits:
          "$ref": "#/components/schemas/AmountTotal"
        netMovement:
          "$ref": "#/components/schemas/Balance"
        closingBalance:
          "$ref": "#/components/schemas/Balance"
        transactionCount:
          type: integer
          format: int64
          minimum: 0
        byType:
          type: array
          minItems: 5
          maxItems: 5
          description: Exactly one entry for each of the five transaction types, including
            zero totals.
          items:
            type: object
            additionalProperties: false
            required:
            - type
            - amount
            - transactionCount
            properties:
              type:
                "$ref": "#/components/schemas/TransactionType"
              amount:
                "$ref": "#/components/schemas/AmountTotal"
              transactionCount:
                type: integer
                format: int64
                minimum: 0
    AmountTotal:
      type: string
      pattern: "^(0|[1-9][0-9]*)\\.[0-9]{2}(?![\\s\\S])"
      description: Nonnegative exact aggregate decimal without a per-transaction integer-digit
        or precision cap. Exactly two fractional ASCII digits and a literal decimal
        point are required; zero is allowed. No sign, whitespace, exponent notation,
        or leading zeros except a single integer zero.
      example: '1250.00'
    Fund:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - currency
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
          example: Growth Fund
        description:
          type: string
          maxLength: 1000
        currency:
          allOf:
          - "$ref": "#/components/schemas/Currency"
          readOnly: true
      example:
        id: 11111111-1111-4111-8111-111111111111
        name: Growth Fund
        description: Long-term growth portfolio
        currency: USD
    Investor:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - email
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "\\S"
          example: Alex Investor
        email:
          type: string
          format: email
          maxLength: 254
          example: alex@example.com
      example:
        id: 22222222-2222-4222-8222-222222222222
        name: Alex Investor
        email: alex@example.com
    Transaction:
      type: object
      additionalProperties: false
      required:
      - id
      - fundId
      - investorId
      - date
      - amount
      - type
      - currency
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fundId:
          "$ref": "#/components/schemas/Id"
        investorId:
          "$ref": "#/components/schemas/Id"
        date:
          type: string
          format: date
          example: '2026-11-06'
        amount:
          "$ref": "#/components/schemas/Amount"
        type:
          "$ref": "#/components/schemas/TransactionType"
        description:
          type: string
          maxLength: 1000
        currency:
          allOf:
          - "$ref": "#/components/schemas/Currency"
          readOnly: true
      example:
        id: 33333333-3333-4333-8333-333333333333
        fundId: 11111111-1111-4111-8111-111111111111
        investorId: 22222222-2222-4222-8222-222222222222
        date: '2026-11-06'
        amount: '1250.00'
        type: CONTRIBUTION
        currency: USD
    FundPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Fund"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    InvestorPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Investor"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    TransactionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Transaction"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    FundReport:
      type: object
      additionalProperties: false
      required:
      - fundId
      - fundName
      - currency
      - from
      - to
      - totals
      properties:
        fundId:
          "$ref": "#/components/schemas/Id"
        fundName:
          type: string
          minLength: 1
          maxLength: 200
          description: Current name of the report fund.
        currency:
          "$ref": "#/components/schemas/Currency"
        from:
          type: string
          format: date
          example: '2026-11-06'
          nullable: true
          description: Inclusive start date; null when all history is included.
        to:
          type: string
          format: date
          example: '2026-11-06'
          nullable: true
          description: Inclusive end date; null when no upper bound is applied.
        totals:
          "$ref": "#/components/schemas/ReportTotals"
      example:
        fundId: 11111111-1111-4111-8111-111111111111
        fundName: Growth Fund
        currency: USD
        from:
        to:
        totals:
          openingBalance: '0.00'
          totalCredits: '1250.00'
          totalDebits: '50.00'
          netMovement: '1200.00'
          closingBalance: '1200.00'
          transactionCount: 2
          byType:
          - type: CONTRIBUTION
            amount: '1250.00'
            transactionCount: 1
          - type: INTEREST_INCOME
            amount: '0.00'
            transactionCount: 0
          - type: DISTRIBUTION
            amount: '0.00'
            transactionCount: 0
          - type: GENERAL_EXPENSE
            amount: '0.00'
            transactionCount: 0
          - type: MANAGEMENT_FEE
            amount: '50.00'
            transactionCount: 1
    InvestorReport:
      type: object
      additionalProperties: false
      required:
      - investorId
      - investorName
      - fundId
      - fundName
      - currency
      - from
      - to
      - totals
      properties:
        investorId:
          "$ref": "#/components/schemas/Id"
        investorName:
          type: string
          minLength: 1
          maxLength: 200
          description: Current name of the report investor.
        fundId:
          type: string
          format: uuid
          nullable: true
          description: Fund filter or null for all funds.
        fundName:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
          description: Current name of the filtered fund; null when no fundId filter is supplied.
        currency:
          "$ref": "#/components/schemas/Currency"
        from:
          type: string
          format: date
          example: '2026-11-06'
          nullable: true
          description: Inclusive start date; null when all history is included.
        to:
          type: string
          format: date
          example: '2026-11-06'
          nullable: true
          description: Inclusive end date; null when no upper bound is applied.
        totals:
