---
openapi: 3.0.3
info:
  title: Investment Ledger API
  version: 2.0.0
  description: |-
    REST contract for ARKAPI-3 under Epic ARKAPI-1, informed by ARKAPI-2 through ARKAPI-7. Implemented backend scope: no frontend, valuation, return calculations, automated fees, or accounting integrations.

    Assumptions requiring business review:
    - All funds use USD with two decimal places. Monetary values are JSON strings for exact BigDecimal parsing; no float/double representation or implicit rounding. Transaction amounts use DECIMAL(18,2) precision: 1–16 integer digits and exactly two fractional digits, from 0.01 to 9999999999999999.99. Report aggregates retain two fractional digits but have no per-transaction integer-digit cap. Inputs exceeding precision/scale are rejected. Currency is server supplied and immutable.
    - Fund–investor participation is explicit and many-to-many. Associate existing resources before posting transactions. Each transaction has exactly one fund and one investor, including expenses and fees. Shared fund expenses must be allocated into separate investor-owned transactions by the caller; no automatic allocation or unassigned fund-level entries.
    - Contributions and interest income add to the ledger; distributions, general expenses, and management fees subtract. Amounts are positive magnitudes and direction is derived only from type. Negative balances are permitted; there is no overdraft/available-funds validation. Balances start at zero, with no stored editable balance, opening capital field, NAV, market value, or performance interpretation.
    - Reporting: select owners first. openingBalance = signed sum of matching entries strictly before from, or zero if from is absent. totalCredits and totalDebits = positive sums within the inclusive [from,to] interval (unbounded when a bound is absent). netMovement = totalCredits - totalDebits. closingBalance = openingBalance + netMovement. transactionCount and byType cover only the interval. No upper bound includes all recorded entries, including future dates. An absent from/to is echoed as null. Reports read a consistent view within one request.
    - Dates are ISO calendar dates without times/time zones. Past and future dates are allowed; dates do not schedule execution. All entries are immediately part of the ledger.
    - Corrections use PUT or DELETE through the existing REST API, and recompute historical reports. Ownership is immutable; correcting owners requires deleting the old entry then creating a new one (not atomic across requests). Successful CREATE/UPDATE/DELETE operations append application-level audit snapshots atomically with the ledger change; history survives hard deletion. Authenticated actor identity and client ownership are recorded; no audit endpoint or tamper-proof retention is provided; direct SQL bypasses auditing. No reversal workflow, optimistic locking, or idempotency keys. Financial production use would require revisiting these choices.
    - Fund/investor deletion is blocked while any membership or transaction references remain. Membership removal is blocked while transactions for that pair remain. Referential checks and each write must be atomic.
    - JWT bearer authentication is required. Select an authorized client explicitly in the path. Database user type, role and direct Client ownership determine access; token role claims and caller-supplied user identifiers do not grant access. Unknown/inaccessible clients and foreign objects return 404.

    Conventions: JSON request/response bodies; errors use application/problem+json. Unknown input fields and explicit nulls in write bodies are rejected; omit optional fields instead. Response fields explicitly marked nullable may contain null. Names must contain a non-whitespace character. PUT replaces mutable fields and does not create missing resources. No PATCH or bulk endpoints. Server-generated ids are UUIDs. Financial resource lists are paginated with stable ordering absent concurrent writes. Identity and administration lists are unpaginated arrays ordered by id; page/size query parameters have no effect. 401 covers absent/invalid authentication, 403 insufficient client role, 400 covers schema and cross-field validation, 404 missing resources, 409 state conflicts, 415 unsupported request content type, and 500 unexpected failures. Error responses omit stack traces and sensitive details.
servers:
- url: http://localhost:8080/api/v1
  description: Standard local API (docker-compose.yml). The self-contained demo defaults to http://localhost:18080/api/v1; use its configured DEMO_API_PORT when overridden.
security:
- bearerAuth: []
tags:
- name: Funds
  description: Fund CRUD.
- name: Investors
  description: Investor CRUD.
- name: Participation
  description: Explicit many-to-many fund membership.
- name: Transactions
  description: Investor-owned fund ledger entries.
- name: Reports
  description: Basic ledger totals and balances.
- name: Identity
  description: Authenticated identity and Client/User administration.
paths:
  "/clients/{clientId}/funds":
    get:
      tags:
      - Funds
      operationId: listFunds
      summary: List funds
      description: |-
        Ordered by id ascending. Empty results return 200 with an empty items array. Pagination is not a snapshot across requests.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      parameters:
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/Size"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FundPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      tags:
      - Funds
      operationId: createFund
      summary: Create fund
      description: |-
        Names and investor emails need not be unique. POST retries may create duplicates; no idempotency-key support is included.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FundInput"
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Fund"
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
                example: "/api/v1/clients/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/funds/11111111-1111-4111-8111-111111111111"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    parameters:
    - "$ref": "#/components/parameters/clientId"
  "/clients/{clientId}/funds/{fundId}":
    parameters:
    - "$ref": "#/components/parameters/clientId"
    - "$ref": "#/components/parameters/fundId"
    get:
      tags:
      - Funds
      operationId: getFund
      summary: Get fund
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Fund"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      description: |2-

        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
    put:
      tags:
      - Funds
      operationId: replaceFund
      summary: Replace fund
      description: |-
        Full replacement of mutable fields; omitted optional fields are cleared. No upsert; unknown id returns 404. Concurrent writes use last-write-wins.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FundInput"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Fund"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    delete:
      tags:
      - Funds
      operationId: deleteFund
      summary: Delete fund
      description: |-
        Hard delete only when no participation or transaction references exist; otherwise 409. No cascading deletion. Unknown id returns 404.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      responses:
        '204':
          description: Deleted; no response body.
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/clients/{clientId}/investors":
    get:
      tags:
      - Investors
      operationId: listInvestors
      summary: List investors
      description: |-
        Ordered by id ascending. Empty results return 200 with an empty items array. Pagination is not a snapshot across requests.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      parameters:
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/Size"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InvestorPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      tags:
      - Investors
      operationId: createInvestor
      summary: Create investor
      description: |-
        Names and investor emails need not be unique. POST retries may create duplicates; no idempotency-key support is included.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InvestorInput"
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Investor"
          headers:
            Location:
              description: URI of the created resource.
              schema:
                type: string
                example: "/api/v1/clients/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/investors/11111111-1111-4111-8111-111111111111"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    parameters:
    - "$ref": "#/components/parameters/clientId"
  "/clients/{clientId}/investors/{investorId}":
    parameters:
    - "$ref": "#/components/parameters/clientId"
    - "$ref": "#/components/parameters/investorId"
    get:
      tags:
      - Investors
      operationId: getInvestor
      summary: Get investor
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Investor"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      description: |2-

        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
    put:
      tags:
      - Investors
      operationId: replaceInvestor
      summary: Replace investor
      description: |-
        Full replacement of mutable fields; omitted optional fields are cleared. No upsert; unknown id returns 404. Concurrent writes use last-write-wins.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InvestorInput"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Investor"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    delete:
      tags:
      - Investors
      operationId: deleteInvestor
      summary: Delete investor
      description: |-
        Hard delete only when no participation or transaction references exist; otherwise 409. No cascading deletion. Unknown id returns 404.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      responses:
        '204':
          description: Deleted; no response body.
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/clients/{clientId}/funds/{fundId}/investors":
    parameters:
    - "$ref": "#/components/parameters/clientId"
    - "$ref": "#/components/parameters/fundId"
    get:
      tags:
      - Participation
      operationId: listFundInvestors
      summary: List investors participating in a fund
      description: |-
        Includes participants with no transactions. Ordered by investor id ascending.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      parameters:
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/Size"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InvestorPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/clients/{clientId}/investors/{investorId}/funds":
    parameters:
    - "$ref": "#/components/parameters/clientId"
    - "$ref": "#/components/parameters/investorId"
    get:
      tags:
      - Participation
      operationId: listInvestorFunds
      summary: List funds for an investor
      description: |-
        Includes memberships with no transactions. Ordered by fund id ascending.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      parameters:
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/Size"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FundPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/clients/{clientId}/funds/{fundId}/investors/{investorId}":
    parameters:
    - "$ref": "#/components/parameters/clientId"
    - "$ref": "#/components/parameters/fundId"
    - "$ref": "#/components/parameters/investorId"
    put:
      tags:
      - Participation
      operationId: addParticipation
      summary: Associate an existing investor with an existing fund
      description: |-
        Idempotent association; both resources must exist. Returns 204 whether newly associated or already associated. No request body.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      responses:
        '204':
          description: Participation exists; no response body.
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    delete:
      tags:
      - Participation
      operationId: removeParticipation
      summary: Remove an investor from a fund
      description: |-
        409 if any transaction belongs to this pair. If both resources exist, an absent association also returns 204. Resource absence returns 404.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      responses:
        '204':
          description: Participation absent; no response body.
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/clients/{clientId}/transactions":
    get:
      tags:
      - Transactions
      operationId: listTransactions
      summary: List and filter transactions
      description: |-
        Filters combine with AND. Ordered by date descending, then id ascending. Empty results return 200. Unknown filter resource returns 404 even if no transactions match. Pagination is not a snapshot.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      parameters:
      - "$ref": "#/components/parameters/Page"
      - "$ref": "#/components/parameters/Size"
      - "$ref": "#/components/parameters/fundIdFilter"
      - "$ref": "#/components/parameters/investorIdFilter"
      - "$ref": "#/components/parameters/Type"
      - "$ref": "#/components/parameters/from"
      - "$ref": "#/components/parameters/to"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    post:
      tags:
      - Transactions
      operationId: createTransaction
      summary: Create a transaction
      description: |-
        Both owners must exist and the investor must participate in the fund (409 otherwise). Amount must exceed 0.00. Duplicate-looking entries are allowed; POST is not idempotent.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransactionInput"
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
          headers:
            Location:
              description: Created transaction URI.
              schema:
                type: string
                example: "/api/v1/clients/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/transactions/33333333-3333-4333-8333-333333333333"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    parameters:
    - "$ref": "#/components/parameters/clientId"
  "/clients/{clientId}/transactions/{transactionId}":
    parameters:
    - "$ref": "#/components/parameters/clientId"
    - "$ref": "#/components/parameters/transactionId"
    get:
      tags:
      - Transactions
      operationId: getTransaction
      summary: Get a transaction
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      description: |2-

        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
    put:
      tags:
      - Transactions
      operationId: replaceTransaction
      summary: Correct a transaction
      description: |-
        Full replacement, no upsert. fundId and investorId must equal stored owners (409 for a change); correct date, amount, type or description. Omitted description is cleared. Reports immediately reflect the correction. Last-write-wins; successful updates atomically append before/after audit snapshots.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransactionInput"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    delete:
      tags:
      - Transactions
      operationId: deleteTransaction
      summary: Delete an erroneous transaction
      description: |-
        Hard deletion immediately removes the entry from all reports, including historical reports. Unknown id returns 404. Audit history is retained atomically after deletion; no reversal workflow.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER or ARK_OPERATIONS. Foreign-client identifiers return 404.
      responses:
        '204':
          description: Deleted; no response body.
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/clients/{clientId}/funds/{fundId}/report":
    parameters:
    - "$ref": "#/components/parameters/clientId"
    - "$ref": "#/components/parameters/fundId"
    get:
      tags:
      - Reports
      operationId: getFundReport
      summary: Get fund ledger report
      description: |-
        Aggregate over all matching transactions, independent of pagination. Includes every investor in the fund. Bounds are inclusive transaction dates. See balance formulas in API description. Zero activity returns all five type buckets with zero totals.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER, CLIENT_REPORT_VIEWER, ARK_OPERATIONS or ARK_REPORT_VIEWER. Foreign-client identifiers return 404.
      parameters:
      - "$ref": "#/components/parameters/from"
      - "$ref": "#/components/parameters/to"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FundReport"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '500':
          "$ref": "#/components/responses/InternalError"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/clients/{clientId}/investors/{investorId}/report":
    parameters:
    - "$ref": "#/components/parameters/clientId"
    - "$ref": "#/components/parameters/investorId"
    get:
      tags:
      - Reports
      operationId: getInvestorReport
      summary: Get investor ledger report
      description: |-
        Aggregate over all matching transactions, independent of pagination. Includes all funds unless fundId is supplied; an existing fund with no matching transactions yields a zero report. Bounds are inclusive transaction dates. See balance formulas in API description. Zero activity returns all five type buckets with zero totals.
        Required role: CLIENT_ADMIN, CLIENT_MANAGER, CLIENT_REPORT_VIEWER, ARK_OPERATIONS or ARK_REPORT_VIEWER. Foreign-client identifiers return 404.
      parameters:
      - "$ref": "#/components/parameters/from"
      - "$ref": "#/components/parameters/to"
      - "$ref": "#/components/parameters/fundIdFilter"
      responses:
