    ClientRole:
      type: string
      enum:
      - CLIENT_ADMIN
      - CLIENT_MANAGER
      - CLIENT_REPORT_VIEWER
      - ARK_ADMIN
      - ARK_OPERATIONS
      - ARK_REPORT_VIEWER
    Client:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
    ClientChange:
      type: object
      additionalProperties: false
      required:
      - name
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
    AppUser:
      type: object
      additionalProperties: false
      required:
      - id
      - issuer
      - subject
      - userType
      - clientId
      - role
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        issuer:
          type: string
          minLength: 1
          maxLength: 1000
        subject:
          type: string
          minLength: 1
          maxLength: 255
        userType:
          type: string
          enum:
          - CLIENT
          - ARK
        clientId:
          type: string
          format: uuid
          nullable: true
        role:
          "$ref": "#/components/schemas/ClientRole"
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        createdAt:
          type: string
          format: date-time
    NewUser:
      description: >-
        Binding requires the configured trusted issuer AND a scope-bound identity approval
        installed by a trusted operator after external identity verification. Issuer validation
        alone does not verify subject ownership. No public registration or identity approval API.
        CLIENT requires clientId and a CLIENT role; ARK requires omitted clientId and an ARK role.
        CLIENT_ADMIN may provision only its own active Client and cannot assign ARK roles.
        ARK_ADMIN may provision into suspended Clients. Missing approval and duplicate binding
        both return 409 Identity binding unavailable without disclosing unrelated registrations.
      type: object
      additionalProperties: false
      required:
      - issuer
      - subject
      - userType
      - role
      - status
      oneOf:
      - required: [clientId]
        properties:
          userType:
            enum: [CLIENT]
          role:
            enum: [CLIENT_ADMIN, CLIENT_MANAGER, CLIENT_REPORT_VIEWER]
      - not:
          required: [clientId]
          properties:
            clientId:
              type: string
              format: uuid
        properties:
          userType:
            enum: [ARK]
          role:
            enum: [ARK_ADMIN, ARK_OPERATIONS, ARK_REPORT_VIEWER]
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 1000
        subject:
          type: string
          minLength: 1
          maxLength: 255
        userType:
          type: string
          enum:
          - CLIENT
          - ARK
        clientId:
          type: string
          format: uuid
        role:
          "$ref": "#/components/schemas/ClientRole"
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
    UserChange:
      type: object
      additionalProperties: false
      required:
      - role
      - status
      properties:
        role:
          "$ref": "#/components/schemas/ClientRole"
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: External OIDC access token. Signature, issuer, audience, expiration
        and subject are validated; an active database-backed application user is required.
        CLIENT ownership and role compatibility are enforced.
