# Explicit local demonstration only; independent of docker-compose.yml and its volumes.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:${DEMO_API_PORT}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/ark_demo?currentSchema=public
      DB_USERNAME: ark_demo
      DB_PASSWORD: ${DEMO_DB_PASSWORD:?Generated by docs/demo.cjs}
      JWT_ISSUER: http://localhost:${DEMO_OIDC_PORT}/realms/ark-dev
      JWT_AUDIENCE: ark-api
      JWT_JWK_SET_URI: http://keycloak:8080/realms/ark-dev/protocol/openid-connect/certs
    depends_on:
      db:
        condition: service_healthy
      # The explicit JWKS URI is fetched when validating tokens, not during API startup.
      # The CLI waits for every service's healthcheck before provisioning identities.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ark_demo
      POSTGRES_USER: ark_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Generated by docs/demo.cjs}
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ark_demo -d ark_demo"]
      interval: 3s
      timeout: 5s
      retries: 30
  keycloak:
    build: ./docs/oidc
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DEMO_OIDC_ADMIN_PASSWORD:?Generated by docs/demo.cjs}
      KC_HOSTNAME: http://localhost:${DEMO_OIDC_PORT}
      KC_HEALTH_ENABLED: "true"
      KC_DB: dev-file
      KC_HTTP_ENABLED: "true"
      KC_CACHE: local
    ports:
      - "127.0.0.1:${DEMO_OIDC_PORT}:8080"
    volumes:
      - demo_import:/opt/keycloak/data/import
      - demo_keycloak:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000; printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; read -r line <&3; [[ \"$$line\" == *'200'* ]]"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
volumes:
  demo_postgres:
  demo_keycloak:
  demo_import:
